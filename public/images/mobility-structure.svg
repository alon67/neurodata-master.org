<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="NeuroData mobility structure. First year at Bar-Ilan University (basic training and data-science internship) with a compulsory summer school at the University of Zagreb. Second year at one of two partners: the University of Padua (cognitive neuroscience and data processing) or the University of Lisbon (biomedical engineering).">
  <defs>
    <style>
      .ttl  { font: 700 46px Helvetica, Arial, sans-serif; fill: #141414; }
      .name { font: 700 26px Helvetica, Arial, sans-serif; fill: #141414; }
      .desc { font: 400 18px Helvetica, Arial, sans-serif; fill: #3a3a3a; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Rings -->
  <circle cx="500" cy="500" r="478" fill="#ededec" stroke="#dcdcdb" stroke-width="2"/>
  <circle cx="500" cy="545" r="222" fill="#d4d4d3" stroke="#c6c6c5" stroke-width="2"/>

  <!-- Ring labels -->
  <text class="ttl" x="500" y="104" text-anchor="middle">2nd year</text>
  <line x1="428" y1="118" x2="572" y2="118" stroke="#141414" stroke-width="3"/>

  <text class="ttl" x="500" y="402" text-anchor="middle">1st year</text>
  <line x1="438" y1="416" x2="562" y2="416" stroke="#141414" stroke-width="3"/>

  <!-- ===== 1st year: Bar-Ilan ===== -->
  <circle cx="500" cy="470" r="34" fill="#fff" stroke="#c7c7c6" stroke-width="2"/>
  <g transform="translate(500,470)">
    <ellipse rx="20" ry="8" fill="none" stroke="#2a6f4a" stroke-width="2.5"/>
    <ellipse rx="20" ry="8" fill="none" stroke="#2a6f4a" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse rx="20" ry="8" fill="none" stroke="#2a6f4a" stroke-width="2.5" transform="rotate(120)"/>
    <circle r="4" fill="#2a6f4a"/>
  </g>
  <text class="name" x="500" y="528" text-anchor="middle">Bar-Ilan U</text>
  <text class="desc" x="500" y="552" text-anchor="middle">Basic training</text>
  <text class="desc" x="500" y="574" text-anchor="middle">Data-Science internship</text>

  <!-- ===== 1st year: Zagreb (summer school) ===== -->
  <circle cx="500" cy="640" r="32" fill="#fff" stroke="#c7c7c6" stroke-width="2"/>
  <g transform="translate(500,640)">
    <circle cx="0" cy="-3" r="12" fill="none" stroke="#2f5aa8" stroke-width="2.5"/>
    <rect x="-6" y="8" width="12" height="7" rx="2" fill="#2f5aa8"/>
    <line x1="-4" y1="18" x2="4" y2="18" stroke="#2f5aa8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text class="name" x="500" y="696" text-anchor="middle">Zagreb U</text>
  <text class="desc" x="500" y="718" text-anchor="middle">Summer School</text>

  <!-- ===== 2nd year: Padua (lower-left) ===== -->
  <circle cx="235" cy="610" r="34" fill="#fff" stroke="#c7c7c6" stroke-width="2"/>
  <g transform="translate(235,610)" stroke="#b03a3a" stroke-width="2" fill="#b03a3a">
    <line x1="-14" y1="-8" x2="6" y2="-14"/>
    <line x1="6" y1="-14" x2="15" y2="6"/>
    <line x1="15" y1="6" x2="-6" y2="13"/>
    <line x1="-6" y1="13" x2="-14" y2="-8"/>
    <circle cx="-14" cy="-8" r="4"/>
    <circle cx="6" cy="-14" r="4"/>
    <circle cx="15" cy="6" r="4"/>
    <circle cx="-6" cy="13" r="4"/>
  </g>
  <text class="name" x="235" y="668" text-anchor="middle">U Padova</text>
  <text class="desc" x="235" y="690" text-anchor="middle">Cognitive neuroscience &amp;</text>
  <text class="desc" x="235" y="712" text-anchor="middle">data processing</text>

  <!-- ===== 2nd year: Lisbon (lower-right) ===== -->
  <circle cx="765" cy="610" r="34" fill="#fff" stroke="#c7c7c6" stroke-width="2"/>
  <g transform="translate(765,610)" stroke="#1f7fb0" stroke-width="3" fill="none">
    <circle r="10"/>
    <g stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-14" x2="0" y2="-19"/>
      <line x1="0" y1="14" x2="0" y2="19"/>
      <line x1="-14" y1="0" x2="-19" y2="0"/>
      <line x1="14" y1="0" x2="19" y2="0"/>
      <line x1="-10" y1="-10" x2="-13.5" y2="-13.5"/>
      <line x1="10" y1="-10" x2="13.5" y2="-13.5"/>
      <line x1="-10" y1="10" x2="-13.5" y2="13.5"/>
      <line x1="10" y1="10" x2="13.5" y2="13.5"/>
    </g>
    <circle r="3" fill="#1f7fb0" stroke="none"/>
  </g>
  <text class="name" x="765" y="668" text-anchor="middle">U Lisbon</text>
  <text class="desc" x="765" y="690" text-anchor="middle">Biomed</text>
  <text class="desc" x="765" y="712" text-anchor="middle">engineering</text>
</svg>
